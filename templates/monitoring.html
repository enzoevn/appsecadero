<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Predicciones Secadero</title>
    <!-- Bootstrap CSS -->
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/chart.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chartjs-plugin-datalabels@2.0.0') }}"></script>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Monitor de Predicciones Secadero</h1>

        <div class="form-group d-flex align-items-center justify-content-center mt-4">
            <div class="d-flex align-items-center justify-content-between col-6">
                <label for="modelSelect" class="col-form-label col-4 text-center">Seleccionar Modelo:</label>
                <select class="form-control" id="modelSelect" onchange="onModelChange()">
                    <option value="" disabled selected>-- Selecciona un modelo --</option>
                    {% for model in model_files %}
                    <option value="{{ model }}">{{ model }}</option>
                    {% endfor %}
                </select>
            </div>
            <button class="btn btn-primary ml-2" onclick="loadModel()">Cargar Modelo</button>
            <button class="btn btn-danger ml-2" onclick="resetPredictions()">Limpiar Predicciones</button>
        </div>

        <!-- Model status indicator -->
        <div class="row justify-content-center mt-2">
            <div class="col-md-8">
                <div id="modelStatus" class="alert alert-warning text-center" role="alert">
                    <strong>⚠️ No hay modelo cargado</strong> - Por favor selecciona y carga un modelo para comenzar el monitoreo
                </div>
            </div>
        </div>

        <div class="row justify-content-center mt-3">
            <!-- Initial weight input -->
            <div class="col-md-6">
                <div class="form-group d-flex align-items-center justify-content-center">
                    <div class="d-flex align-items-center">
                        <label for="initialWeightInput" class="col-form-label mr-3" style="min-width: 120px;">Peso inicial (g):</label>
                        <input type="number" class="form-control mr-3" id="initialWeightInput" min="100" max="10000" placeholder="ej: 2500" value="2500" style="width: 150px;" title="Ingrese el peso inicial entre 100g y 10000g">
                        <button class="btn btn-secondary" onclick="setInitialWeight()">Establecer</button>
                    </div>
                </div>
            </div>

            <!-- Shrinkage expected input -->
            <div class="col-md-6">
                <div class="form-group d-flex align-items-center justify-content-center">
                    <div class="d-flex align-items-center">
                        <label for="expectedShrinkageInput" class="col-form-label mr-3" style="min-width: 120px;">Merma esperada (%):</label>
                        <input type="number" class="form-control mr-3" id="expectedShrinkageInput" min="0" max="100" step="0.1" placeholder="ej: 15.0" value="23.0" style="width: 150px;" title="Ingrese la merma esperada entre 0% y 100%">
                        <button class="btn btn-secondary" onclick="setExpectedShrinkage()">Establecer</button>
                    </div>
                </div>
            </div>
        </div>


        <div class="d-flex">
            <div class="chart-container">
                <canvas id="predictionChart"></canvas>
            </div>

            <div id="last-prediction-container" class="last-prediction-container">
                <!-- Last prediction content will be loaded here -->
            </div>
        </div>

        <div id="predictions" class="container text-center" style="width: 100%; max-height: 150px; overflow-y: scroll;">
            <!-- Predictions content will be loaded here -->
        </div>
    </div>
    <!-- Bootstrap JS and dependencies -->
    <script src="{{ url_for('static', filename='js/jquery-3.5.1.slim.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/popper.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
